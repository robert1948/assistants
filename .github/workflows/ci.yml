name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required files
        run: |
          test -f README.md
          test -f LICENSE
          test -d src
          test -d tests
          test -d docs

      - name: Confirm clean line endings in markdown
        run: |
          if grep -IRn $'\r' -- *.md docs/ src/ tests/; then
            echo "CRLF line endings found. Please use LF."
            exit 1
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
